[tool.ruff]
target-version = "py312"
line-length = 100
# All application/test Python files, including newly added modules, are checked.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["twin_lab"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
cache_dir = "/tmp/twin-lab-mypy-cache"
# Gradual checking: unannotated function parameters remain dynamic. All runtime
# bodies are checked; schema/persistence boundary annotations grow with changes.
